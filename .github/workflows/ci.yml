name: CI - Testes e Auditoria

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Testes e Auditoria de Integridade
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar Dependências de Teste
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Executar Testes Automatizados (pytest)
        run: |
          pytest -v

      - name: Executar Auditoria de Licenças e Hashes
        run: |
          python -m biblioteca_reformada.cli audit

      - name: Validar Consulta Textual FTS5 Real
        run: |
          python -m biblioteca_reformada.cli search "verdade"
